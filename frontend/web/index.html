<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>sprawl</title>
        <link rel="stylesheet" href="./index.css" />
        <script type="module" src="./dist/main.js"></script>
    </head>
    <body>
        <div id="app">
            <div id="toolbar">
                <button id="new-document">New</button>
                <input type="text" id="document-title" placeholder="Document title" />
                <button id="open-file-ui">Files</button>
                <div id="colors">
                    Colors: 
                    <label for="stroke-color">Pen</label>
                    <input type="color" id="stroke-color" value="#dddddd"/>
                    <label for="bg-color">Background</label>
                    <input type="color" id="bg-color" value="#222222"/>
                </div>
                <div id="eraser">
                    <label for="eraser-size">Eraser</label>
                    <input type="range" id="eraser-size" min="2" max="100" step="1" value="10"/>
                </div>
            </div>
            <div class="centered-overlay" id="file-ui" hidden>
                <div id="file-ui-header">
                    Files
                    <button id="close-file-ui">Close</button>
                </div>
                <div id="file-ui-list"></div>
            </div>
            <div class="centered-overlay" id="render-retry-message" hidden>
                Graphics unavailable, retrying...
            </div>
            <div class="centered-overlay" id="render-failed-message" hidden>
                Graphics unavailable. Please close and re-open the tab.
            </div>
            <canvas id="canvas"></canvas>
            <div id="eraser-cursor" hidden></div>
            <div id="stats"></div>
        </div>
    </body>
</html>
